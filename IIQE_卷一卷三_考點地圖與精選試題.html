是特殊情況，並因此稱為「蓋印的合約」", "iii)如要有效，這種合約隨後須以書面表達", "iv)儘管不是以口頭表達或書面方式，這種合約仍是有效的"], "opts": ["i, ii, iii", "i, ii, iv", "i, iii, iv", "ii ,iii, iv"], "a": "A", "ex": "簡單合約意味着合約的訂立是簡單、容易的。簡單合約分為口頭合約，不經蓋章的書面合約及從行為中推斷出來的合約。簡單來說，簡單合約的有效性並不取決於特殊的手續。選項i,ii,iii不正確", "tag": ""}, {"n": 14, "sec": "2.1.2(b)", "stem": ["以下哪些是有關契據的正確描述?"], "opts": ["它是成熟的簡單合約", "合約的價值高", "以書面形式簽發", "以上各項皆是"], "a": "C", "ex": "契據是經簽署、蓋章和交付的書面文書。某些交易例如土地的轉讓，必須以契據達成。答案C正確", "tag": ""}, {"n": 15, "sec": "2.1.2(b)", "stem": ["下列哪項或哪些有關以契據形式訂立的合約的評論是正確的？"], "opts": ["它們經蓋章後發出", "它們大多以書面方式表達", "它們是一類成熟的簡單合約", "上述一切評論都正確"], "a": "A", "ex": "契據是經簽署、蓋章和交付的書面文書。某些交易例如土地的轉讓，必須以契據達成。答案A正確", "tag": ""}, {"n": 16, "sec": "2.1.3", "stem": ["以下哪一項不屬於簡單合約必須具備的元素？"], "opts": ["交付", "承約", "訂約的行為能力", "代價"], "a": "A", "ex": "有效的合約須具備的元素包括:要約、承約、代價、訂約的行為能力、合法性及訂立法律關係的意向。交付不屬於簡單合約必須具備的元素", "tag": ""}, {"n": 17, "sec": "2.1.3", "stem": ["以下哪項可使無效的保險合約之陳述是正確的?"], "opts": ["可使無效的合約是永遠不能變為有效的", "可使無效與無效兩者的含義完全相同", "受屈的一方可於合理時間內把合約視為無效的決定", "只有被保險人才能把保單視作可使無效(即可予以取消)"], "a": "C", "ex": "可使無效的合約是項明顯有法律效力的合約，其法律效力一直維持下去，除非及直至有受屈的一方把合約視為自訂立時起即屬無效，但須在一段合理時間內進行", "tag": ""}, {"n": 18, "sec": "2.1.3", "stem": ["一份合約由於一些要求還未完成而導致有關合約無法執行，此稱為:"], "opts": ["可使無效的合約", "不能強制執行的合約", "無效的合約", "不合法的合約"], "a": "B", "ex": "不能強制執行的合約無法在法庭上執行（或藉以起訴）不過，這不是合約無效的緣故，而是由於某些要求還未完成，例如土地租約尚未繳納印花稅、水險單還未發出等。只要完成這些要求，該合約亦隨之可予以強制執行", "tag": ""}, {"n": 19, "sec": "2.1.3(e)", "stem": ["一般協議有別於合約的原因，以下有哪些或哪項的描述是正確的？"], "opts": ["合約必須以書面形式訂立", "合約必須有兩位以上的見證人", "合約包含多項法律準則", "以上所有各項"], "a": "C", "ex": "合約可透過口頭，書面及行為形式訂立，協定涉及的內容必須是合法的。例如，涉及殺人或其他犯罪行為的合約是無效的。答案C正確", "tag": "熱門"}, {"n": 20, "sec": "2.1.3", "stem": ["以下哪項是「可使無效」的合約最佳描述?"], "opts": ["一個法律不能撤銷的合約", "一個法律無法生效的合約", "一個於投保階段提供錯誤投保資料的保險合約", "一個法律不存在的合約"], "a": "C", "ex": "於投保階段提供錯誤投保資料的保險合約，保險人有可能就投保人違反最高誠信推翻保單，成為可使無效的合約", "tag": ""}, {"n": 21, "sec": "2.1.3(b)", "stem": ["在反要約的過程中，下列哪項是不正確的？"], "opts": ["原本的要約人成為受要約人", "原本的受要約人成為要約人", "原本的要約內容立刻被終止並撤銷", "若反要約的內容不被接納，原本的要約內容可再次有效"], "a": "D", "ex": "如果受要約人有  48, "sec": "3.2.3(b)", "stem": ["以下哪項是最高誠信原則下無須披露的事實?", "i.木 材是易燃的", "ii. 保安系統被拆除", "iii. 倉庫內是容許吸煙的", "iv. 操作機器的工人訓練有素"], "opts": ["i,ii,iv", "i,iv", "i,iii,iv", "ii,iii,iv"], "a": "B", "ex": "木材是易燃的屬常識範圍內的事實，操作機器的工人訓練有素屬於降低風險的事實，兩者都屬無須披露的事實", "tag": "最新"}, {"n": 49, "sec": "3.2.4", "stem": ["如果保險人要求保證所有披露資料，不論重要與否，均需完全真實，這表示:"], "opts": ["違反法例並不能強制執行", "延伸普通法中的最高誠信的要求", "這合約受制於而非最高誠信", "這合約受制於最高誠信"], "a": "B", "ex": "保險受到一種更為嚴格、在普通法中常被稱為最高誠信的原則所約束。保險人有時把普通法中的最高誠信責任加以延伸，要求投保人聲明或保證，無論是否與「重要」事件有關連，所有經披露的資料都必須完全真實的。答案B正確", "tag": ""}, {"n": 50, "sec": "3.2.4", "stem": ["保險人有時會把普通法中有關最高誠信的要求延伸，要求投保人在保單上作出特定聲明，原因是："], "opts": ["通過這聲明，投保人保證無論是否涉及重要事件，所提供的事實必須實質上真實", "通過這聲明，投保人保證所提供的重要事實，必須完全真實", "通過聲明，投保人保證，無論是否與重要事件有關連，所有提供的資料都必須完全真實", "以上各項皆不是"], "a": "C", "ex": "保險受到一種更為嚴格、在普通法中常被稱為最高誠信的原則所約束。它的意思是，不論另一方是否要求有關的資料，各方必須向另一方披露所有「重要事實」。例如，即使投保單上並沒有相關的問題，火險投保人仍須向保險人披露有關損失的紀錄。答案C正確", "tag": ""}, {"n": 51, "sec": "3.2.5", "stem": ["就保險而言，欺詐性不披露:"], "opts": ["等同違反保證", "如屬投保人的行為，在技術上則容許保險人推翻合約", "屬於違反最高誠信，只容許受屈的一方作出損害賠償", "是指投保人漫不經心的情況下對重要事實作出失實陳述"], "a": "B", "ex": "如果最高誠信責任遭違反，受屈的保險人可得到某些針對違反方的補救:1.在合理時間內自始推翻整個合約2.如屬於欺詐性或疏忽性失實陳述的情況，可以額外提出侵權法訴訟以索取損害賠償3.對違反不予追究，合約便有追溯效力地生效答案B正確", "tag": "最新"}, {"n": 52, "sec": "3.2.6", "stem": ["在保險合約中，下列哪項不屬於最高誠信的補救？"], "opts": ["受屈一方可推翻合約", "受屈的保險人可以追回不知該項違反情況支付的賠償", "受屈的一方可向另一方展開刑事檢控", "如果涉及詐騙，受屈一方便可提出侵權法追討賠償"], "a": "C", "ex": "如果屬於欺詐性或疏忽性失實陳述的情況，保險人可以額外提出侵權法訴訟以索取損害賠償；侵權是一種民事錯誤，犯錯者可能被申索。答案C不正確", "tag": ""}]}, {"id": "p1-pc", "t": "近因", "pre": ["3.3"], "pts": ["最顯著、最具效力的原因（不是時間上最近的原因）", "受保危險：保單承保；除外危險：條款明確排除；不保危險：既非受保、也非除外（如火險中的下雨、盜竊）", "受保危險引致不保危險 → 可獲賠償（如救火時消防員破門）", "單一原因屬不保或除外危險 → 不賠", "適用於所有險種"], "mn": "近因看力量，不看時間", "trap": "首個或最後一個原因不一定是近因", "qs": [{"n": 53, "sec": "3.3.1", "stem": ["一種理解為「一項對損失最顯著及最具效力的理由」的保險原則為："], "opts": ["近因", "分擔", "最高誠信", "可保權益"], "a": "A", "ex": "一項損失或事件可以是數個成因合起來的力量所造成的。因為不是每一項成因都是受保的，為着保險索償或保險金要求的目的，必須於每一個案中抽出一個主導的成因。一種理解為「一項對損失最顯著及最具效力的理由」的保險原則為近因", "tag": ""}, {"n": 54, "sec": "3.3.1", "stem": ["以下哪項屬於近因中被視為\"危險\"?"], "opts": ["地震", "身體嚴重受傷", "火警警報器故障", "以上各項皆是"], "a": "A", "ex": "有關危險即是有關損失的成因，地震造成的損失原因", "tag": ""}, {"n": 55, "sec": "3.3.1", "stem": ["下列哪項有關近因的陳述是正確的？"], "opts": ["它僅適用於財產保險", "由一個以上的成因引致的損失，只有涉及保險風險引致的損失得到保障", "由單一成因引致的損失，如該成因是一項不保危險，便不能就所引致的損失得到保障", "由一系列的事故引致的損失，只有首個的成因能構成近因"], "a": "C", "ex": "近因原則適用於所有保險類型，由一系列的事故引致的損失，首個或最後的成因不一定構成近因。如果只有單一成因，假如它是不保或除外危險便不受保。只有答案C正確", "tag": ""}, {"n": 56, "sec": "3.3.2", "stem": ["除外危險_____________:"], "opts": ["保單不承保的危險", "與不保危險有相同的對待", "除超額保障以外，將會承保的危險", "例如各種天災，地震等"], "a": "A", "ex": "除外危險是被除外責任條款豁免承保的，答案A正確", "tag": ""}, {"n": 57, "sec": "3.3.3", "stem": ["以下哪項是描述「既不是受保也不是除外責任的危險，而是在保單保障的範圍以外」？"], "opts": ["受保危險", "除外危險", "不保危險", "非受保特定危險"], "a": "C", "ex": "不保危險既非受保的，也不是除外的。由不保危險引致的損失是不獲賠償或給付保險金的，除非引發不保危險發生的是某項受保危險。例如，標準火險單的不保危險包括了下雨和盜竊。", "tag": ""}, {"n": 58, "sec": "3.3.3", "stem": ["某單位投保火險後，鄰居發生火警，在必要情況下，消防員需要破壞此單位某些設施進入鄰居救火，有關這些設施的損失："], "opts": ["因為受保危險引致不保危險，故此可得到賠償", "因為不保危險引致受保危險，故此得不到賠償", "屬於不保危險，故此得不到賠償", "屬於受保危險，故此得到賠償"], "a": "A", "ex": "如果涉及一項以上的危險，由受保危險直接引發的不保危險，所引致的損失可獲賠償", "tag": ""}]}, {"id": "p1-ind", "t": "彌償", "pre": ["3.4"], "pts": ["精確財務補償：不多也不少", "方法：現金支付、修理、更換、恢復原狀", "損餘＝受損標的的剩餘部分；委付＝把所有權交給保險人以取得全損賠償（常見於水險）", "比例分攤：不足額投保的懲罰。賠償＝損失 ×（保額 ÷ 實際價值）", "限制彌償：比例分攤、免賠額、起賠額", "超越彌償：重置保險、以新代舊、約定價值保單、水險", "人壽保險及人身意外保險屬於「利益保單」，不適用彌償原則"], "mn": "彌償是母親，分擔、代位是兒子", "trap": "比例分攤只適用於大部分非水險財產保險，並非所有險種", "qs": [{"n": 59, "sec": "3.4", "stem": ["以下哪兩項保險原理有相當密切的關係 ?", "i) 彌償", "ii)分擔", "iii)近因", "iv)最高誠信"], "opts": ["i，ii", "ii，iii", "iii，iv", "i，iii"], "a": "A", "ex": "只有當彌償出現時，分擔才會適用。所以該兩項保險原理有相當密切的關係", "tag": ""}, {"n": 60, "sec": "3.4.2", "stem": ["以下哪些關於彌償原則的描述正確？", "i.所 有禁止彌償原則應用的保單均是不能強制執行的", "ii. 它通常適用於非人壽保險", "iii. 從根本上說，它意味著對承保損失的精確財務補償", "iv. 人身意外及人壽保險不受彌償原則所約束"], "opts": ["i,ii", "i,iii", "ii,iii,iv", "i,ii,iii,iv"], "a": "C", "ex": "彌償是指對損失作出既不多也不少的精確財務補償。彌償不能應用於一切保險類別。有些險種在計算損失時，無法精確地用財務方法去量度，尤其是人壽保險及人身意外保險。這兩種保險所針對的都是人命的傷亡，根本沒有任何方法能精確地用金錢來量度出來。所以人壽保險及人身意外保險一般不適用彌償原則。只有選項ii,iii,iv正確。", "tag": "最新"}, {"n": 61, "sec": "3.4.2", "stem": ["一男子在人身意外保單和汽車意外保單中投保了意外死亡利益。如他在駕駛自己的汽車發生了意外而死亡:"], "opts": ["每份保單必須賠償死亡利益全數", "僅僅首先生效的保單必須支付死亡利益", "僅僅提供較大保額的保單必須賠償", "既然死亡是由汽車意外導致，僅僅汽車保單須賠付"], "a": "A", "ex": "人壽保險及人身意外保險是提供利益的保單，而不是提供彌償的保單。因人命的損失不可能以財務方法精確計算，人壽保險及人身意外保險能辦到的僅是按照死亡或損傷訂明的數額支付利益，答案A正確", "tag": ""}, {"n": 62, "sec": "3.4.2", "stem": ["人壽及人身意外保單有時稱為「利益保單」，這是由於它們:"], "opts": ["屬於人身保險，因此不受比例分攤的約束", "在正常情況下都能提供補償", "所提供的多於財務補償", "按本身支付的保險金，無須繳稅"], "a": "A", "ex": "人壽保險及人身意外保險是提供利益的保單，而不是提供彌償的保單。因人命的損失不可能以財務方法精確計算，人壽保險及人身意外保險能辦到的僅是按照死亡或損傷訂明的數額支付利益，不受彌償原則下的比例分攤所約束", "tag": ""}, {"n": 63, "sec": "3.4.2", "stem": ["人壽與人身意外保險不受彌償原則約束，原因是:"], "opts": ["無法精確計算人命價值", "無限的可保權益", "無論支付多少錢不能精確地作出彌償", "以上各項皆成立"], "a": "D", "ex": "人壽保險及人身意外保險所針對的都是人的傷亡，根本沒有任何方法可以把人命損失精確地用金錢來量度出來，所以這些類型的業務一般不適用彌償原則。另外，人壽保險及人身意外保險一般可視為涉及價值無限的可保權益。以上各項皆正確", "tag": ""}, {"n": 64, "sec": "3.4.3", "stem": ["作為在保險上的一項的重要原則，彌償同時與下列哪項或哪些保險原則有重要關聯？"], "opts": ["代位", "分擔", "可保權益", "上述所有各項"], "a": "D", "ex": "可保權益是對某項標的的財務「權益」，就全損的情況下賠付多少錢才能讓保單持有人得到完全的彌償。另外，分擔及代位是彌償原則的引伸，上述所有各項都是與彌償有重要關聯", "tag": ""}, {"n": 65, "sec": "3.4.4", "stem": ["以下哪項/哪幾項屬於提供彌償的方法？"], "opts": ["恢復原狀", "更換", "現金支付", "以上各項皆是"], "a": "D", "ex": "財產保險單通常訂明保險人按照四種方法中的任何一項償付損失:(a)現金支付(b)修理(c)更換，給被保險人替換全新的，不受折舊影響的物件(d)恢復原狀，意指使受保財物恢復到其受毀以前那一刻所處的狀況，以上各項皆屬提供彌償的方法", "tag": ""}, {"n": 66, "sec": "3.4.5", "stem": ["作為計算彌償時予以考慮的一環，「損餘」應解作："], "opts": ["維修受損害物件時應付的金錢", "搶救涉及索償的物件的成本", "受到摧毀的保險標的剩餘部分", "剛出現損害前該物件的價值"], "a": "C", "ex": "「損餘」應解作受到摧毀的保險標的剩餘部分", "tag": "熱門"}, {"n": 67, "sec": "3.4.5", "stem": ["以下哪項對損餘的描述是不正確的?"], "opts": ["向保險人交出標的，以索取全部損失賠償金額的慣例", "部分損失", "損毀標的的剩餘部分", "金額以下的任何損失，被保險人都得不到保障"], "a": "D", "ex": "在量度損失的準確金額時，有時保險標的在受損後，會留下剩餘部分，例如被火損壞的存貨，車輛的殘骸等。這些剩餘部分稱為「損餘」。如果這些剩餘部分還具有經濟價值，在提供彌償時，必須把該價值考慮在內，例如：損餘可由保險人收回並自行處理，保險人就會以全額賠償予被保險人，或者在賠償額中扣除損餘的價值，損餘則歸被保險人所有。答案D對損餘的描述不正確", "tag": ""}, {"n": 68, "sec": "3.4.6", "stem": ["以下哪項或哪些對「委付」一詞的評論是準確的？"], "opts": ["它在水險中較為普遍", "在多數火險保單中，它通常被明確列明不予考慮", "它是指向保險人交出保險標的", "上述所有各項"], "a": "D", "ex": "這個詞大多數出現在水險中，它是指在某些情況下向保險人交出保險標的，作為索取全損的賠償金額的條件。在水險中，這是一種十分標準的做法。不過在其他類別的財產保單中，通常明確地列明不容許委付。以上各項描述皆正確", "tag": ""}, {"n": 69, "sec": "3.4.6", "stem": ["把受保財產的所有權交給保險人，以取得全損賠款的慣例稱為："], "opts": ["損餘", "轉讓", "代位", "委付"], "a": "D", "ex": "這個詞大多數出現在水險中，它是指在某些情況下向保險人交出保險標的，作為索取全損的賠償金額的條件。在水險中，這是一種十分標準的做法", "tag": ""}, {"n": 70, "sec": "3.4.7(a)", "stem": ["如果一份財產保險單被稱為「受比例分攤條件約束」，那麼它的意思是："], "opts": ["所代表的是一種標準風險，因此標準保費適用於該風險", "不足額保險是不重要的", "在任何情況下均不會對損失提供十足的支付", "如果保額足夠的話，便會對損失提供十足的支付"], "a": "D", "ex": "大部分類型的非水險財產保險均受比例分攤的限制，保險人預期受保財產會以其全額的價值投保。否則，當出現損失時，賠付金額便會按不足額投保比率遞減。", "tag": ""}, {"n": 71, "sec": "3.4.7(a)", "stem": ["一項損失發生了，金額為$4000，就此提供的火險單的保額為$1,000,000；並包含了一項比例分攤條件和一項金額為$8,000的單一物件限額，損失發生時，受保財產的實際價值為$2,000,000；保險人根據保單提供了彌償之後，把受摧毀的財產賣掉，取得$500，請問保險人根據保單賠付了多少錢?在處理了財產之後，並須就損餘價值(如有的話)向被保險人支付多少錢?"], "opts": ["分別為$2000和$0", "分別為$4000和$0", "分別為$2000和$250", "分別為$2000和$500"], "a": "C", "ex": "價值200萬的財物，如果只投保100萬，不足額投保出現了比例分攤，被保險人只能夠收取二分之一的賠償金額，損失$4000元時只能賠付$2000元。另外，保險公司賠償二分之一的損失，就$500元損餘可分享二分之一的價值，即是$250元，餘下$250元損餘價值由被保險人收取。所以答案是C", "tag": ""}, {"n": 72, "sec": "3.4.7(a)", "stem": ["以下哪項對保險術語「比例分攤」的描述是不正確的？"], "opts": ["在火險中，它是對不足額的懲罰", "在水險中，它的涵義與火險截然不同", "它是對保險額不足的懲罰，應用於各種類型的保險", "以上所有陳述皆不正確"], "a": "C", "ex": "「比例分攤」是對保險額不足的懲罰。只有大部分類型的非水險財產保險均明文受比例分攤的限制。答案C描述不正確", "tag": ""}, {"n": 73, "sec": "3.4.7(b)", "stem": ["以下哪項阻止了保單為被保險人作出彌償?", "i.比 例分攤", "ii. 多於二人有可保權益", "iii. 免賠額", "iv. 起賠額"], "opts": ["i,ii", "i,ii,iv", "i,iii,iv", "ii,iii,iv"], "a": "C", "ex": "比例分攤，免賠額，起賠額屬限制彌償的保單條文，意味着規定的賠償金額比彌償金額為低，選項 i,iii,iv正確", "tag": ""}, {"n": 74, "sec": "3.4.8", "stem": ["重置保險，「以新代舊」保障，約定價值保單及水險保單之共通點是："], "opts": ["不受彌償限制", "同樣提供超越彌償", "同樣適用於所有業務", "跟彌償沒有關係"], "a": "B", "ex": "重置保險，「以新代舊」保障，約定價值保單及水險保單同樣屬於提供超越彌償的保單", "tag": ""}, {"n": 75, "sec": "3.4.8", "stem": ["一份海上船體保單的承保表是這樣寫的：「保額$1,000,000；約定價值$1,000,000」，意味着："], "opts": ["當一項損失發生時，保額是賠償金額", "該約定價值將被視為損失時的實際價值，但只限於全損索償目的", "約定價值一律被視為損失時的實際價值", "這是一份重置保險"], "a": "C", "ex": "水險保單和海上貨物保單是以定值方式提供保險保障的，約定價值一律  "香港年金計劃是由香港年金有限公司推出的", "tag": ""}, {"n": 37, "sec": "2.3.1b(b)(ii)", "stem": ["何先生正在審視一份獲授權保險人所發出的合資格延期年金保單(QDAP)。作為獲保監局認證的QDAP，必須在利益說明文件中披露內部回報率(IRR)。何先生正了解IRR的運作方式，這涉及一連串在不同時間點發生的收入(年金給付)或支出(保費開支)的投資計劃。以下哪項有關IRR的說法是正確？", "i.特定的收入越是遠離計劃的開始日期，內部回報率就越低", "ii.特定的支出越是遠離計劃的開始日期，內部回報率就越高", "iii.可以通過將投資計劃的IRR與其機會成本或其他財務指標進行比較，來決定是否參與該投資計劃", "iv.IRR不能比較年金計劃及其他金融投資產品的工具"], "opts": ["i,ii", "i,ii,iii", "ii,iii,iv", "i,ii,iii,iv"], "a": "B", "ex": "內部回報率是個有用的財務工具，它用於評估涉及一連串在不同時間點發生的收入或支出的投資計劃。特定的收入越是遠離計劃的開始日期，內部回報率就越低。相反地，特定的支出越是遠離計劃的開始日期，內部回報率就越高。可以通過將投資計劃的內部回報率與其機會成本或其他財務指標進行比較，來決定是否參與該投資計劃。選項 i、ii、iii 正確", "tag": "最新"}, {"n": 38, "sec": "2.3.1b", "stem": ["根據《合資格延期年金保單指引》，合資格延期年金保費的總額不得少於:"], "opts": ["100000", "150000", "180000", "200000"], "a": "C", "ex": "合資格延期年金保費的總額不得少於18萬元", "tag": ""}, {"n": 39, "sec": "2.4(d)", "stem": ["由多個僱主參加獨立團體壽險計劃為其各自的僱員提供保障是："], "opts": ["綜合團體 (combined group）", "多個僱主的團體 (multiple-employer group)", "獨立僱主團體 (independent-employer group)", "多過一個僱主團體 (more-than-one-employer group)"], "a": "B", "ex": "由多個僱主參加獨立團體壽險計劃為其各自的僱員提供保障是多個僱主的團體", "tag": ""}]}]}, {"name": "③ 附加保障（24%）🔥", "color": "#f472b6", "topics": [{"id": "p3-dis", "t": "殘疾利益（WP／殘疾收入）", "pre": ["3.1"], "pts": ["豁免保費（WP）：完全傷殘並經過等候期（3或6個月）後，豁免續保保費；保單依然有效，繼續累積現金價值及紅利", "WP期間不得更改繳費頻率（或年繳自動轉為月繳）", "殘疾收入：完全殘疾期間每月給付收入，不屬貸款或預繳，也不從保額中扣除", "殘疾收入的常用條款：完全殘疾的定義、應付金額、等候期、並非貸款或預繳（不包括年齡限制）"], "mn": "WP＝免交錢；殘疾收入＝給你錢", "trap": "失業不屬WP的保障範圍", "qs": [{"n": 40, "sec": "3.1.1", "stem": ["以下哪項或哪些是殘疾豁免保費附約的正確陳述？"], "opts": ["殘疾豁免保費附約生效期間保單將依然有效", "如果受保保單所有人完全傷殘，保險人會代為支付傷殘期間的保費", "豁免原本應由被保險人繳付的續保保費", "以上各項皆正確"], "a": "D", "ex": "殘疾豁免保費附約：豁免是自願放棄某項權利或取消某項規則的行為。此附約可附加於幾乎所有類型的壽險，保險人承諾在受保保單所有人完全傷殘時，放棄收取續保保費的權利。這並不代表保單被中止，保單將依然有效；可產生現金價值的保單會繼續產生現金價值，分紅保單會繼續產生紅利，猶如保單所有人已如期支付保費。以上各項皆正確", "tag": "最新"}, {"n": 41, "sec": "3.1.1", "stem": ["「殘疾豁免保費」附約規定？"], "opts": ["如果受保保單所有人完全傷殘，保險人會豁免傷殘期間的保費", "如果在受保保單生效6個月以上，保單所有人完全傷殘，保險人會豁免傷殘期間的保費", "失業期間豁免支付保費", "如其他保險人提供較低的保費率，保險人便會退回保費"], "a": "A", "ex": "殘疾豁免保費附約承諾在受保保單所有人完全傷殘達最 function open(t,c){CUR=t;COL=c;F='all';dt.textContent=t.t;dt.style.color=c;ds.textContent='精選試題 '+t.qs.length+' 題 · 章節 '+t.pre.join(' / ');body();dr.classList.add('on');ov.classList.add('on');dr.scrollTop=0}
function body(){const t=CUR;let h='<div class="box"><h4>📌 核心考點</h4><ul>'+t.pts.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></div>';
h+='<div class="box mnb"><h4>🧠 記憶口訣</h4><b>'+esc(t.mn)+'</b></div><div class="box trap"><h4>⚠️ 易錯陷阱</h4>'+esc(t.trap)+'</div>';
h+='<div class="flt">'+[['all','全部'],['熱門','🔥 熱門'],['最新','🆕 最新'],['wrong','❌ 錯題'],['todo','⏳ 未答']].map(([k,l])=>'<button class="fb'+(F===k?' on':'')+'" data-f="'+k+'">'+l+'</button>').join('')+'</div>';
const qs=t.qs.filter(q=>{const r=S[K+q.n];return F==='all'||q.tag===F||(F==='wrong'&&r&&r!==q.a)||(F==='todo'&&!r)});
if(!qs.length)h+='<div class="empty">這個篩選條件下沒有題目。</div>';
qs.forEach(q=>{const r=S[K+q.n];h+='<div class="q'+(r?' done':'')+'" id="q'+q.n+'"><div class="qh">第 '+q.n+' 題 · '+q.sec+(q.tag?'<span class="tag t'+q.tag+'">'+q.tag+'</span>':'')+'</div><div class="stem">'+q.stem.map(s=>'<div>'+esc(s)+'</div>').join('')+'</div>'+
q.opts.map((o,i)=>{const L='ABCD'[i];let cl='';if(r){if(L===q.a)cl=' ok';else if(L===r)cl=' no'}return'<button class="op'+cl+'" data-n="'+q.n+'" data-l="'+L+'">'+L+'. '+esc(o)+'</button>'}).join('')+
'<div class="ex"><b style="color:#22d3ee">答案：'+q.a+'</b>　'+esc(q.ex)+'</div></div>'});db.innerHTML=h}
db.onclick=e=>{const f=e.target.closest('.fb');if(f){F=f.dataset.f;body();return}
const o=e.target.closest('.op');if(!o)return;const n=+o.dataset.n;if(S[K+n])return;S[K+n]=o.dataset.l;save();
const y=dr.scrollTop;body();dr.scrollTop=y;render()};
function close(){dr.classList.remove('on');ov.classList.remove('on')}cx.onclick=close;ov.onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.querySelectorAll('.tab[data-k]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab[data-k]').forEach(x=>x.classList.remove('on'));b.classList.add('on');K=b.dataset.k;render()});
reset.onclick=()=>{if(confirm('清除所有作答紀錄？')){Object.keys(S).forEach(k=>delete S[k]);save();render()}};
render();
</script></body></html>
